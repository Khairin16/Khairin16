<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Personal Profile Page</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }
      body {
        background: linear-gradient(135deg, #dbeafe, #f5d0fe);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .container {
        width: 100%;
        max-width: 950px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .card {
        background: white;
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }
      h2 {
        margin-bottom: 16px;
        color: #333;
      }
      .input-group {
        margin-bottom: 14px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
      }
      input,
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 10px;
        outline: none;
      }
      textarea {
        resize: none;
        height: 80px;
      }
      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }
      button:hover {
        background: #1d4ed8;
      }
      .profile {
        text-align: center;
      }
      .profile img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 14px;
        border: 4px solid #2563eb;
      }
      .profile h3 {
        font-size: 24px;
        margin-bottom: 8px;
      }
      .profile p {
        color: #555;
        margin: 6px 0;
      }

      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h2>Update Profile</h2>
        <form id="profileForm">
          <div class="input-group">
            <label>Name</label>
            <input
              type="text"
              id="name"
              placeholder="Enter your name"
              required
            />
          </div>
          <div class="input-group">
            <label>Profession</label>
            <input type="text" id="profession" placeholder="Web Developer" />
          </div>
          <div class="input-group">
            <label>Profile Image URL</label>
            <input type="text" />
            <textarea
              id="Image"
              placeholder="c:\Users\KHAIRIN\Desktop\Flower_bookey.png"
            ></textarea>
          </div>
          <div class="input-group">
            <label>Profile Image URL</label>
            <input type="text" id="image" placeholder="Paste image link" />
          </div>
          <button type="submit">Update Profile</button>
        </form>
      </div>

      <div class="card profile">
        <img id="Doremon" src="Do Re mon.jpg" alt="Profile" />
        <h3 id="profileName"> UMME SADIA KHAIRIN </h3>
        <p id="profileProfession"> CST Student </p>
        <p id="profileBio">This is my Bio Data .....</p>
      </div>
    </div>

    <script>
      const form = document.getElementById("profileForm");
      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const name = document.getElementById("name").value;
        const profession = document.getElementById("profession").value;
        const bio = document.getElementById("bio").value;
        const image = document.getElementById("image").value;

        document.getElementById("profileName").textContent =
          name || "Your Name";
        document.getElementById("profileProfession").textContent =
          profession || "Your Profession";
        document.getElementById("profileBio").textContent =
          bio || "Your bio will appear here...";

        if (image.trim() !== "") {
          document.getElementById("profileImg").src = image;
        }
      });
    </script>
  </body>
</html>
